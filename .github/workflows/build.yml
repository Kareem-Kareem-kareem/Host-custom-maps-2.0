name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Clone BakkesMod SDK
      run: git clone https://github.com/bakkesmodorg/BakkesModSDK.git external/BakkesModSDK

    - name: Clone ImGui
      run: git clone https://github.com/ocornut/imgui.git external/imgui

    - name: Configure CMake
      run: >
        cmake -B build -S .
        -DBAKKESMOD_SDK_PATH=${{ github.workspace }}/external/BakkesModSDK
        -DIMGUI_PATH=${{ github.workspace }}/external/imgui

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HostworkshopMaps
        path: build/Release/*.dll
